[pytest]
# Pytest configuration for MITuna testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Command line options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Coverage options (when running with pytest-cov)
# Usage: pytest --cov=tuna --cov-report=html --cov-report=term
# These are defined in .coveragerc

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require external resources)
    db: Tests that require database connection
    slow: Tests that take significant time to run
    miopen: Tests specific to MIOpen functionality
    worker: Tests for worker/celery functionality
    driver: Tests for driver command parsing
    subcmd: Tests for subcommand functionality
    utils: Tests for utility modules
    smoke: Quick smoke tests to verify basic functionality

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (in seconds) - prevent hanging tests
# timeout = 300

# Minimum Python version
minversion = 3.9

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

